name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install buildozer and dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev cmake python3-pip python3-distutils libtinfo5
          python3 -m pip install --user buildozer

      - name: Build APK with buildozer
        run: |
          export PATH="$PATH:$HOME/.local/bin"
          yes | buildozer -v android debug 2>&1 | tee buildozer_ci.log
        continue-on-error: true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer_ci.log

      - name: Fail if no APK
        run: |
          if ls bin/*.apk >/dev/null 2>&1; then
            echo "APK OK"
          else
            echo "NO APK - build failed"
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: toolhost-apk
          path: bin/*.apk
